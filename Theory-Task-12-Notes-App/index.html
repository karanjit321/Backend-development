<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App - Theory Task 12</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>📝 Notes App</h1>
        <p>Theory Task 12 — LocalStorage & JSON</p>
    </header>

    <main class="container">

        <section class="note-form">
            <h2>Create a Note</h2>

            <textarea
                id="noteInput"
                placeholder="Write your note here..."
                rows="4"
            ></textarea>

            <button id="addBtn">Add Note</button>
        </section>

        <section>
            <div class="notes-header">
                <h2>My Notes</h2>
                <span id="noteCount">0 notes</span>
            </div>

            <div id="notesList"></div>

            <p id="emptyMessage">No notes yet. Create your first note!</p>
        </section>

    </main>

    <footer>
        <p>Backend Development • Theory Task 12</p>
    </footer>

    <script src="script.js"></script>cd..
</body>
</html>
